<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元气 - 策略对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>元气</h1>
        
        <div class="game-info">
            <div class="player player1">
                <h2>🧑 你 <span class="mp-badge">🔮 <span id="mp1">0</span></span></h2>
                <div class="stats">
                    <div class="hp">❤️ <span id="hp1">存活</span></div>
                </div>
            </div>
            <div class="vs">VS</div>
            <div class="player player2">
                <h2>🤖 AI <span class="mp-badge">🔮 <span id="mp2">0</span></span></h2>
                <div class="stats">
                    <div class="hp">❤️ <span id="hp2">存活</span></div>
                </div>
            </div>
        </div>

        <div class="round-info">
            <div id="round-status">第 <span id="round">1</span> 回合 - 双方请出招</div>
        </div>

        <div class="skills">
            <div class="player-skills" style="flex: 1;">
                <h3>🧑 你的技能</h3>
                <div class="skill-buttons" id="skills1">
                    <button class="skill" data-skill="ramen">🍜 拉面<br><small>攒2魔</small></button>
                    <button class="skill" data-skill="slash">⚔️ 一斩<br><small>0.5伤</small></button>
                    <button class="skill" data-skill="Ldef">🛡️ L防<br><small>攒1魔 防斩</small></button>
                    <button class="skill" data-skill="wave">🌊 波<br><small>耗2魔 2伤</small></button>
                    <button class="skill" data-skill="Xdef">✖️ X防<br><small>攒1魔 防波</small></button>
                </div>
            </div>
        </div>

        <div class="battle-log-container">
            <div class="battle-log" id="player-log">
                <h3>🧑 你的记录</h3>
                <div id="player-log-content"></div>
            </div>
            <div class="battle-log" id="ai-log">
                <h3>🤖 AI的记录</h3>
                <div id="ai-log-content"></div>
            </div>
        </div>

        <div class="actions">
            <button id="next-round" style="display:none;">下一回合/重新开始</button>
        </div>

        <div class="result" id="result" style="display:none;">
            <h2 id="winner"></h2>
            <button id="restart">重新开始</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
