<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元气 - 策略对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>元气</h1>
        
        <div class="game-info">
            <div class="player player1">
                <h2>玩家 1</h2>
                <div class="stats">
                    <div class="hp">❤️ <span id="hp1">10</span></div>
                    <div class="mp">🔮 <span id="mp1">0</span></div>
                </div>
            </div>
            <div class="vs">VS</div>
            <div class="player player2">
                <h2>玩家 2</h2>
                <div class="stats">
                    <div class="hp">❤️ <span id="hp2">10</span></div>
                    <div class="mp">🔮 <span id="mp2">0</span></div>
                </div>
            </div>
        </div>

        <div class="round-info">
            <div id="round-status">第 <span id="round">1</span> 回合 - 双方请出招</div>
        </div>

        <div class="skills">
            <div class="player-skills">
                <h3>玩家 1 出招</h3>
                <div class="skill-buttons" id="skills1">
                    <button class="skill" data-skill="ramen" data-player="1">🍜 拉面<br><small>+2魔</small></button>
                    <button class="skill" data-skill="slash" data-player="1">⚔️ 一斩<br><small>0.5伤</small></button>
                    <button class="skill" data-skill="Ldef" data-player="1">🛡️ L防<br><small>+1魔 防斩</small></button>
                    <button class="skill" data-skill="wave" data-player="1">🌊 波<br><small>2魔 2伤</small></button>
                    <button class="skill" data-skill="Xdef" data-player="1">✖️ X防<br><small>+1魔 防波</small></button>
                </div>
            </div>

            <div class="player-skills">
                <h3>玩家 2 出招</h3>
                <div class="skill-buttons" id="skills2">
                    <button class="skill" data-skill="ramen" data-player="2">🍜 拉面<br><small>+2魔</small></button>
                    <button class="skill" data-skill="slash" data-player="2">⚔️ 一斩<br><small>0.5伤</small></button>
                    <button class="skill" data-skill="Ldef" data-player="2">🛡️ L防<br><small>+1魔 防斩</small></button>
                    <button class="skill" data-skill="wave" data-player="2">🌊 波<br><small>2魔 2伤</small></button>
                    <button class="skill" data-skill="Xdef" data-player="2">✖️ X防<br><small>+1魔 防波</small></button>
                </div>
            </div>
        </div>

        <div class="battle-log" id="battle-log">
            <h3>战斗记录</h3>
            <div id="log-content"></div>
        </div>

        <div class="result" id="result" style="display:none;">
            <h2 id="winner"></h2>
            <button id="restart">重新开始</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
